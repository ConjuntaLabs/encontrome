# Pull request: só build, para um Dockerfile quebrado aparecer antes da main.
# Push: build, push de :latest e :sha-<commit> no registry da Magalu Cloud e
# deploy no Dokploy (o app puxa :latest).
# Rollback: no app do Dokploy, troque a tag para sha-<commit> e faça o deploy.
#
# Secrets (repo > Settings > Secrets and variables > Actions):
#   MGC_REGISTRY_USERNAME, MGC_REGISTRY_PASSWORD   `mgc container-registry credentials get`
#   DOKPLOY_URL, DOKPLOY_APP_ID, DOKPLOY_API_KEY   painel do Dokploy
# Sem os DOKPLOY_* a imagem é publicada e o deploy é pulado.

name: Deploy

on:
  pull_request:
  push:
    branches: ['main']
    paths-ignore:
      - '*.md'
      - 'wordpress/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: container-registry.br-se1.magalu.cloud
  IMAGE_NAME: conjunta-registry/encontrome

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Um push que trava no registry fica parado sem erro; sem limite esperaria 6 h.
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.MGC_REGISTRY_USERNAME }}
          password: ${{ secrets.MGC_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on Dokploy
        if: github.event_name != 'pull_request'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_APP_ID" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::warning::DOKPLOY_* secrets not set: image pushed, deploy skipped"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"$DOKPLOY_APP_ID\",\"title\":\"CI: ${GITHUB_SHA::7}\"}"
